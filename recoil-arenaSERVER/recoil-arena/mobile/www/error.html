<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recoil Arena 3D</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#58c8ff,#8f86ff 55%,#ff9be0);font-family:sans-serif;color:#fff;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.35)}h1{font-size:2.2rem;margin:0 0 10px}.s{width:44px;height:44px;margin:16px auto;border:7px solid #fff8;border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div><h1>RECOIL ARENA 3D</h1><div class="s"></div><p id="m">Conectando con el servidor…<br><small>El servidor gratuito puede tardar hasta un minuto en despertar.<br>Comprueba también tu conexión a Internet.</small></p></div>
<script>
// Reintenta cargar el juego cada 5 s hasta que el servidor responda.
var URL_GAME = 'https://recoil-arena.onrender.com/';
function tryLoad(){ fetch(URL_GAME + 'health', {cache:'no-store', mode:'no-cors'}).then(function(){ location.href = URL_GAME; }).catch(function(){ setTimeout(tryLoad, 5000); }); }
tryLoad();
</script></body></html>
