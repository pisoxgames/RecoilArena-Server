# Fly.io: `fly launch --copy-config --no-deploy` y luego `fly deploy` (cambia "app" por un nombre único)
app = "recoil-arena-iker"
primary_region = "mad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
